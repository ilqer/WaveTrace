[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "wavetrace"
version = "0.1.0"
description = "WiFi-CSI sensing pipeline: posture & weapon recognition, camera-supervised, CSI-only at deploy."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
wavetrace = "wavetrace.entrypoints.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# P7 weapon CNN backend (lazy-imported; everything else runs without it). Pi/laptop only.
cnn = ["torch>=2.0"]

# System dependencies (macOS) — managed via Brewfile, install with: brew bundle
# ffmpeg: webcam stream + camera-supervised collect (avoids cv2 AVFoundation crash)

[tool.scikit-build]
# Build the _wavetrace extension into the wavetrace package.
wheel.packages = ["wavetrace"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Matches the project's existing line-wrap style (see CLAUDE.md).
line-length = 110
target-version = "py310"
extend-exclude = [
    "_skbuild",
    "build",
    "archive",
    "docs",
    "data",
    "output",
    "models",
    "web/ui",
    "firmware/*/managed_components",
    "firmware/*/build",
]

[tool.ruff.lint]
select = ["F", "N"]
ignore = []

[tool.ruff.lint.pep8-naming]
# CLAUDE.md §6: `X` / `y` in ML code and maths symbols next to their formula (`H`, `S_inv`, `E_n`)
ignore-names = ["[A-Z]", "[A-Z]_*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Most modules predate type hints, so mypy is advisory: it is not part of the verify gate.
check_untyped_defs = false
disallow_untyped_defs = false
exclude = [
    "^build/",
    "^_skbuild/",
    "^archive/",
    "^docs/",
    "^web/ui/",
    "^firmware/.*/managed_components/",
    "^firmware/.*/build/",
]

[tool.importlinter]
root_packages = ["wavetrace", "scripts", "fixtures", "experiments"]

[[tool.importlinter.contracts]]
# The CSI-only recognition package, its CLI and dashboard API included, must not reach into the
# operator scripts, its own test-data generators, or the research scripts around it.
name = "wavetrace does not depend on scripts, fixtures or experiments"
type = "forbidden"
source_modules = ["wavetrace"]
forbidden_modules = ["scripts", "fixtures", "experiments"]

[[tool.importlinter.contracts]]
# The dashboard API must not reach sideways into operator scripts or throwaway experiments.
name = "the dashboard API does not depend on scripts or experiments"
type = "forbidden"
source_modules = ["wavetrace.entrypoints.api"]
forbidden_modules = ["scripts", "experiments"]

[[tool.importlinter.contracts]]
# Each operator script is a standalone entrypoint; one must never reach into another's internals.
# This only catches a properly-qualified `from scripts.X import Y` — a bare `from collect_count
# import countName` via a sys.path hack is syntactically indistinguishable from importing an
# unrelated package, so import-linter cannot see it; that class of defect is fixed in code, not by
# a lint rule.
name = "scripts are independent of each other"
type = "independence"
modules = [
    "scripts.collect_baseline",
    "scripts.collect_camera",
    "scripts.collect_count",
    "scripts.collect_presence",
    "scripts.collect_weapon",
    "scripts.health_monitor",
    "scripts.mesh_verify",
    "scripts.ntp_server",
    "scripts.run_count",
    "scripts.run_live_mesh",
    "scripts.run_weapon",
]

[[tool.importlinter.contracts]]
# `wavetrace.entrypoints` holds the composition roots; nothing else imports them.
name = "nothing outside wavetrace.entrypoints imports it"
type = "forbidden"
# "wavetrace.*", not the bare "wavetrace" package: import-linter's forbidden contract silently
# skips a source/forbidden pair that overlaps as packages, so "wavetrace" against
# "wavetrace.entrypoints" would check nothing. Only "wavetrace.entrypoints" itself overlaps, and is
# correctly skipped.
source_modules = ["wavetrace.*", "scripts", "fixtures", "experiments"]
forbidden_modules = ["wavetrace.entrypoints"]

[[tool.importlinter.contracts]]
name = "the CLI and the dashboard API do not import each other"
type = "independence"
modules = ["wavetrace.entrypoints.cli", "wavetrace.entrypoints.api"]

[[tool.importlinter.contracts]]
# entrypoints > outer ring > application > domain; indirect chains count. The outer ring is adapters plus
# every package not in another layer; exhaustive = true fails an unplaced top-level module.
name = "wavetrace layers: entrypoints > outer ring > application > domain"
type = "layers"
containers = ["wavetrace"]
layers = [
    "entrypoints",
    "adapters : diagnostics : groundtruth : output : pipeline : recognition : source : synthetic",
    "application",
    "domain",
]
exhaustive = true

[[tool.importlinter.contracts]]
# One-way only: adapters read the domain's heads, never the training/serving package around them.
# A two-way dependency here is what previously forced function-local imports.
name = "adapters do not depend on the recognition package"
type = "forbidden"
source_modules = ["wavetrace.adapters"]
forbidden_modules = ["wavetrace.recognition"]
