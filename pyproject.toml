[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "wavetrace"
version = "0.1.0"
description = "WiFi-CSI sensing pipeline: posture & weapon recognition, camera-supervised, CSI-only at deploy."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
wavetrace = "wavetrace.Cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# P7 weapon CNN backend (lazy-imported; everything else runs without it). Pi/laptop only.
cnn = ["torch>=2.0"]

# System dependencies (macOS) — managed via Brewfile, install with: brew bundle
# ffmpeg: webcam stream + camera-supervised collect (avoids cv2 AVFoundation crash)

[tool.scikit-build]
# Build the _wavetrace extension into the wavetrace package.
wheel.packages = ["wavetrace"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
# Legacy PascalCase test files (CLAUDE.md naming) stay Test*.py until Phase 6's tree rename;
# new Phase-3-onward tests use the final PEP 8 test_*.py name (REFACTOR_PLAN.md §1.2/§1.5).
python_files = ["Test*.py", "test_*.py"]
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]

[tool.ruff]
# Matches the project's existing line-wrap style (see CLAUDE.md).
line-length = 110
target-version = "py310"
extend-exclude = [
    "_skbuild",
    "build",
    "archive",
    "docs/archive",
    "data",
    "output",
    "models",
    "web/ui",
    "firmware/*/managed_components",
    "firmware/*/build",
]

[tool.ruff.lint]
# pep8-naming (N) is intentionally OFF: the codebase is camelCase Python on purpose until
# Phase 6 of REFACTOR_PLAN.md converts it. Turning N on here would fight every existing name.
select = ["F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Phase 0 is behaviour-preserving and may not touch these files (REFACTOR_PLAN.md Phase 0 hard
# constraints). Each entry below is pre-existing pyflakes debt caught by turning the linter on for
# the first time, not something introduced here — left in place and noted under "Found, deferred"
# in REFACTOR_PROGRESS.md for a later, in-scope phase to clean up.
"experiments/weapon_experiments.py" = ["F541"]
"scripts/health_monitor.py" = ["F401"]
"scripts/ntp_server.py" = ["F541"]
"scripts/run_live_mesh.py" = ["F401"]
"tests/TestCir.py" = ["F841"]
"tests/TestFeatures.py" = ["F401"]
"tests/TestFrontendExt.py" = ["F401", "F841"]
"tests/TestMeshLinks.py" = ["F401"]
"tests/TestRegression.py" = ["F401"]
"tests/TestSubcarrierSelect.py" = ["F401", "F841"]
"wavetrace/Cli.py" = ["F401"]
"wavetrace/Localize.py" = ["F401"]
"wavetrace/groundtruth/Webcam.py" = ["F401"]
"wavetrace/recognition/Heatmap.py" = ["F841"]
"web/app.py" = ["F401"]
"web/foxglove.py" = ["F401"]
"web/streamer.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The codebase predates type hints in most modules; this is a starting posture for Phase 0,
# not an enforced gate yet (mypy is not part of the Phase 0 verify gate).
check_untyped_defs = false
disallow_untyped_defs = false
exclude = [
    "^build/",
    "^_skbuild/",
    "^archive/",
    "^web/ui/",
    "^firmware/.*/managed_components/",
    "^firmware/.*/build/",
]

[tool.importlinter]
root_packages = ["wavetrace", "web", "scripts", "fixtures", "experiments"]

[[tool.importlinter.contracts]]
# The CSI-only recognition package must not reach into the web dashboard, the operator scripts,
# its own test-data generators, or the research scripts around it.
name = "wavetrace does not depend on web, scripts, fixtures or experiments"
type = "forbidden"
source_modules = ["wavetrace"]
forbidden_modules = ["web", "scripts", "fixtures", "experiments"]

[[tool.importlinter.contracts]]
# The delivery layer must not reach sideways into operator scripts or throwaway experiments.
name = "web does not depend on scripts or experiments"
type = "forbidden"
source_modules = ["web"]
forbidden_modules = ["scripts", "experiments"]

[[tool.importlinter.contracts]]
# Each operator script is a standalone entrypoint; one must never reach into another's internals.
# This only catches a properly-qualified `from scripts.X import Y` — a bare `from collect_count
# import countName` via a sys.path hack is syntactically indistinguishable from importing an
# unrelated package, so import-linter cannot see it; that class of defect is fixed in code, not by
# a lint rule.
name = "scripts are independent of each other"
type = "independence"
modules = [
    "scripts.collect_baseline",
    "scripts.collect_camera",
    "scripts.collect_count",
    "scripts.collect_presence",
    "scripts.collect_weapon",
    "scripts.health_monitor",
    "scripts.mesh_verify",
    "scripts.ntp_server",
    "scripts.run_count",
    "scripts.run_live_mesh",
    "scripts.run_weapon",
]

[[tool.importlinter.contracts]]
# `wavetrace.Cli` is the composition root; nothing else imports it.
name = "nothing outside Cli.py imports the wavetrace.Cli entrypoint"
type = "forbidden"
# "wavetrace.*", not the bare "wavetrace" package: import-linter's forbidden contract silently
# skips a source/forbidden pair that overlaps as packages, so "wavetrace" against "wavetrace.Cli"
# would check nothing. Only "wavetrace.Cli" itself overlaps, and is correctly skipped.
source_modules = ["wavetrace.*", "web", "scripts"]
forbidden_modules = ["wavetrace.Cli"]

[[tool.importlinter.contracts]]
# Backends are resolved only in wavetrace.adapters.recognition.heads; the heads and the domain layer take one injected.
name = "domain and the recognition heads do not depend on adapters"
type = "forbidden"
source_modules = ["wavetrace.domain", "wavetrace.recognition.Model", "wavetrace.recognition.Weapon"]
forbidden_modules = ["wavetrace.adapters"]
